services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: companion-minio
    ports: ["9000:9000", "9001:9001"]
    environment: { MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}, MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin} }
    command: server /data --console-address ":9001"
    volumes: [minio_data:/data]
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"], interval: 10s, timeout: 5s, retries: 10 }

  create-buckets:
    environment: { MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}, MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin} }
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      for b in companion-bronze companion-silver companion-gold companion-ml companion-logs; do mc mb -p local/$$b || true; done"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    environment: { ZOOKEEPER_CLIENT_PORT: 2181 }
    healthcheck: { test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"], interval: 10s, timeout: 5s, retries: 10 }

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    depends_on: { zookeeper: { condition: service_healthy } }
    ports: ["9092:9092", "9093:9093"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck: { test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"], interval: 15s, timeout: 10s, retries: 12 }

  kafka-init:
    image: confluentinc/cp-kafka:7.8.0
    depends_on: { kafka: { condition: service_healthy } }
    command: >
      bash -c "for t in booking-events user-events chat-events companion-events analytics-events; do kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1; done"

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment: { POSTGRES_USER: ${POSTGRES_USER:-airflow}, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}, POSTGRES_DB: ${POSTGRES_DB:-airflow} }
    volumes: [postgres_airflow:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-airflow} -d $${POSTGRES_DB:-airflow}"], interval: 10s, timeout: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }

  redis-feast:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }

  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    depends_on: { postgres: { condition: service_healthy }, kafka-init: { condition: service_completed_successfully } }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://airflow:airflow@postgres:5432/airflow}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ENABLE_KAFKA: "true"
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 15s, timeout: 5s, retries: 10 }

  airflow-init:
    image: apache/airflow:2.10.4-python3.11
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, create-buckets: { condition: service_completed_successfully } }
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-companion-secret-key}
      COMPANION_API_URL: ${COMPANION_API_URL:-http://api:8000/api/events/export}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-amazon==9.2.0 apache-airflow-providers-celery==3.8.5 great_expectations==0.18.22 pandas==2.2.3 pyarrow==18.1.0 s3fs==2024.12.0
    volumes: &airflow-volumes
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/logs:/opt/airflow/logs
      - ../data/csv:/opt/airflow/data/csv
    command: bash -c "airflow db migrate && airflow users create --username $${AIRFLOW_ADMIN_USER:-admin} --password $${AIRFLOW_ADMIN_PASSWORD:-admin} --firstname Data --lastname Platform --role Admin --email admin@example.com || true && airflow connections add minio_conn --conn-type aws --conn-login $${MINIO_ROOT_USER:-minioadmin} --conn-password $${MINIO_ROOT_PASSWORD:-minioadmin} --conn-extra '{\"endpoint_url\": \"http://minio:9000\", \"aws_access_key_id\": \"$${MINIO_ROOT_USER}\", \"aws_secret_access_key\": \"$${MINIO_ROOT_PASSWORD}\"}' || true"

  airflow-webserver:
    image: apache/airflow:2.10.4-python3.11
    depends_on: { airflow-init: { condition: service_completed_successfully } }
    ports: ["8080:8080"]
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    healthcheck: { test: ["CMD", "curl", "--fail", "http://localhost:8080/health"], interval: 20s, timeout: 10s, retries: 10 }

  airflow-scheduler:
    image: apache/airflow:2.10.4-python3.11
    depends_on: { airflow-init: { condition: service_completed_successfully } }
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    healthcheck: { test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"], interval: 30s, timeout: 10s, retries: 10 }

  airflow-worker:
    image: apache/airflow:2.10.4-python3.11
    depends_on: { airflow-init: { condition: service_completed_successfully } }
    environment: *airflow-env
    volumes: *airflow-volumes
    command: celery worker
    healthcheck: { test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME}"], interval: 30s, timeout: 10s, retries: 10 }

  spark:
    image: bitnami/spark:3.5
    volumes: ["../spark:/opt/companion/spark"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      SPARK_EXTRA_CLASSPATH: /opt/bitnami/spark/jars/*
    command: tail -f /dev/null

  jobmanager:
    image: flink:1.19-scala_2.12-java17
    ports: ["8081:8081"]
    command: jobmanager
    environment: { JOB_MANAGER_RPC_ADDRESS: jobmanager }
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8081/overview"], interval: 15s, timeout: 5s, retries: 10 }

  taskmanager:
    image: flink:1.19-scala_2.12-java17
    depends_on: { jobmanager: { condition: service_healthy } }
    command: taskmanager
    environment: { JOB_MANAGER_RPC_ADDRESS: jobmanager }
    volumes: ["../flink:/opt/companion/flink"]

  feast:
    build: { context: .., dockerfile: feast/Dockerfile }
    depends_on: { redis-feast: { condition: service_healthy } }
    volumes: ["../feast/companion_platform/feature_repo/data:/app/companion_platform/feature_repo/data"]
    environment:
      FEAST_USAGE: "False"
    profiles: ["feast"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    ports: ["8123:8123", "9002:9000"]
    environment: { CLICKHOUSE_DB: companion, CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}, CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse} }
    volumes: ["../clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql"]
    healthcheck: { test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"], interval: 10s, timeout: 5s, retries: 10 }

  stream-clickhouse-sink:
    build: { context: .., dockerfile: streaming/Dockerfile }
    depends_on: { kafka-init: { condition: service_completed_successfully }, clickhouse: { condition: service_healthy } }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    restart: unless-stopped

  event-generator:
    build: { context: .., dockerfile: kafka/Dockerfile }
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    environment: { KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}, EVENT_INTERVAL_SECONDS: ${EVENT_INTERVAL_SECONDS:-2} }
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    depends_on: { clickhouse: { condition: service_healthy } }
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    healthcheck: { test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"], interval: 15s, timeout: 5s, retries: 10 }

  cubejs:
    image: cubejs/cube:v0.36.11
    depends_on: { clickhouse: { condition: service_healthy } }
    ports: ["4000:4000"]
    volumes: ["../cubejs:/cube/conf"]
    environment:
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse
      CUBEJS_DB_PORT: "8123"
      CUBEJS_DB_USER: ${CLICKHOUSE_USER:-default}
      CUBEJS_DB_PASS: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CUBEJS_DB_NAME: companion
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-secret}
      CUBEJS_DEV_MODE: "true"
    healthcheck: { test: ["CMD-SHELL", "wget --spider -q http://localhost:4000/readyz"], interval: 15s, timeout: 5s, retries: 10 }

  frontend:
    build: { context: .., dockerfile: frontend/Dockerfile }
    depends_on: { api: { condition: service_healthy }, cubejs: { condition: service_healthy } }
    ports: ["8082:80"]
    healthcheck: { test: ["CMD", "wget", "--spider", "-q", "http://localhost/"], interval: 15s, timeout: 5s, retries: 10 }

volumes:
  minio_data:
  postgres_airflow:
  grafana_data:
